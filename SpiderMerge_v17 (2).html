  G.bossWarnTimer=0;
  G.bossWarnActive=false;
  G.nextMiniBossWave=5;
  G.specialWave=false;
  G.biomeBossSpawned=[false,false,false,false,false,false];
  G.webPatches=[];
  G.lightningStrikes=[];
  G.eventTickTimer=0;
  G.goblinSpider=null;
  G.goblinSpawnTimer=0;
  G.goblinPopupTimer=0;
  // Load save if exists
  loadGame(slot);
  G.discovered.add(phenoKey(G.player.mutations));
  // PATCH 5 — distribute initial fusion spiders across ALL biomes
  // Weighted toward Jardim (idx 0) and Laboratório (idx 5)
  const initSpiderWeights=[10,8,8,8,8,10];
  const totalInitW=initSpiderWeights.reduce((a,b)=>a+b,0);
  for(let i=0;i<60;i++){
    let r=Math.random()*totalInitW,biomeIdx=0;
    for(let j=0;j<initSpiderWeights.length;j++){r-=initSpiderWeights[j];if(r<=0){biomeIdx=j;break;}}
    G.spiders.push(randomSpider(false,BIOMES[biomeIdx].mutBias,biomeIdx));
  }
  // Predators across all biomes too
  const initPredWeights=[2,2,2,2,2,3];
  const totalPredW=initPredWeights.reduce((a,b)=>a+b,0);
  for(let i=0;i<12;i++){
    let r=Math.random()*totalPredW,biomeIdx=0;
    for(let j=0;j<initPredWeights.length;j++){r-=initPredWeights[j];if(r<=0){biomeIdx=j;break;}}
    G.predators.push(createPredator(pickPredatorTypeForWave(1),false,biomeIdx));
  }
  G.projectiles=[];
  updateHUD();
  updateAbilityButtons();
  // Show joystick
  document.getElementById('joystick').style.display='block';
  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp){
  if(!G.running)return;
  const dt=Math.min((timestamp-G.lastTime)/1000,0.05);
  G.lastTime=timestamp;
  // PATCH 4 — pause game while modals (Dex/Abilities/Menu/Choice) are open
  if(!G.paused){
    G.gameTime+=dt;
    update(dt);
  }
  render();
  requestAnimationFrame(gameLoop);
}

function update(dt){
  const p=G.player;
  if(!p)return;
  // Determine biome (uses shared helper so predators/bosses agree with player)
  G.currentBiome=biomeAt(p.y);
  // v12 — Update ambient motes for motion feedback
  updateAmbientMotes(dt);
  // Input - virtual joystick + keyboard fallback
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy=-1;
  if(keys['s']||keys['arrowdown'])dy=1;
  if(keys['a']||keys['arrowleft'])dx=-1;
  if(keys['d']||keys['arrowright'])dx=1;
  // Joystick (analog - magnitude from 0..1)
  const joyMag=Math.sqrt(G.joystick.dx*G.joystick.dx+G.joystick.dy*G.joystick.dy);
  if(joyMag>0.1){
    dx=G.joystick.dx;
    dy=G.joystick.dy;
  }
  const inputLen=Math.sqrt(dx*dx+dy*dy);
  if(inputLen>1){dx/=inputLen;dy/=inputLen;}
  // Speed
  let speed=p.baseSpeed*(p.speedBoost>0?1.6:1);
  if(G.event&&G.event.effect==='speed_debuff')speed*=G.event.value;
  if(G.event&&G.event.effect==='snare'&&Math.random()<0.05)speed*=0.3;
  // v14 — Eclipse slow + web patch snare
  if(G.event&&G.event.effect==='eclipse')speed*=(G.event.value||0.5);
  if(p._webSnared&&p._webSnared>0)speed*=0.3;
  p.x+=dx*speed*60*dt;
  p.y+=dy*speed*60*dt;
  p.x=Math.max(30,Math.min(WORLD_SIZE-30,p.x));
  p.y=Math.max(30,Math.min(WORLD_SIZE-30,p.y));
  // v10 — OTIMIZADO: Rotação mais rápida e eficiente
  if(inputLen>0.05){
    p.moving=true;
    const targetDir=Math.atan2(dy,dx);
    let diff=targetDir-p.facingDir;
    if(diff>Math.PI)diff-=Math.PI*2;
    else if(diff<-Math.PI)diff+=Math.PI*2;
    const turnRate=6; // radians per second (reduzido para menos cálculos)
    const step=Math.sign(diff)*Math.min(Math.abs(diff),turnRate*dt);
    p.facingDir+=step;
  } else {
    p.moving=false;
  }
  // Camera follow
  G.camera.x=canvas.width/2-p.x;
  G.camera.y=canvas.height/2-p.y;
  // Detect "mudou de mapa" event — when the player crosses a biome boundary.
  // Predators and bosses whose homeBiome != current biome will give up the
  // chase and start walking home (handled in their AI blocks below).
  if(G.currentBiome!==G.lastPlayerBiome){
    G.lastPlayerBiome=G.currentBiome;
  }
  // Wave system (Improvement 3) — advance wave every G.waveDuration seconds.
  // Each wave changes the predator type mix and rotates the boss type so the
  // same enemies never stay on the map forever.
  // v14 — Wave system reworked:
  //   • Every 5 waves → mini-boss spawns (1.5x size, 1.4x damage).
  //   • Every 7 waves → "special wave" (only alfa/mutant predators).
  //   • After wave 20 → enemies scale faster (+1.5/wave instead of +0.7).
  G.waveTimer+=dt;
  if(G.waveTimer>=G.waveDuration){
    G.waveTimer=0;
    G.wave++;
    // v14 — Mini-boss every 5 waves
    if(G.wave % 5 === 0 && G.player.level >= 3){
      const mbt = BOSS_TYPES[Math.floor(Math.random()*BOSS_TYPES.length)];
      const mb = createBoss(mbt);
      mb.isMiniBoss = true;
      mb.size *= 1.5;
      mb.damage = Math.round(mb.damage * 1.4);
      mb.attackDamage = Math.round(mb.attackDamage * 1.3);
      mb.name = 'MINI-BOSS: ' + mb.name;
      mb.surviveReward = 12;
      G.bosses.push(mb);
      SFX.bossAppear();showToast(`💀 MINI-BOSS: ${mb.name} apareceu! (Onda ${G.wave})`,'#fbbf24');
      spawnParticle(G.player.x, G.player.y, '#fbbf24', 30, 80, 2, 1.5);
    }
    // v14 — Special wave every 7 waves (only alfa/mutant)
    G.specialWave = (G.wave % 7 === 0);
    if(G.specialWave){
      showToast(`🌟 ONDA ESPECIAL ${G.wave}! Apenas mutantes e alfas!`,'#a855f7');
      // Convert all current predators to alfa/mutant
      G.predators.forEach(pr=>{
        if(pr.hasNoHp){
          const newType = Math.random()<0.5 ? 'alfa' : 'mutant';
          const newPred = createPredator(newType, false, pr.homeBiome);
          newPred.x = pr.x; newPred.y = pr.y;
          // Replace in-place
          Object.assign(pr, newPred);
        }
      });
    } else {
      SFX.waveStart();showToast(`Onda ${G.wave} chegando!`,'#a78bfa');
    }
  }
  // v14 — Biome exclusive boss spawn: when player enters a biome whose boss
  // has not yet spawned in the current phase, spawn it once.
  if(!G.biomeBossSpawned[G.currentBiome] && G.player.level >= 4){
    // Only spawn if no biome boss is currently alive for this biome
    const hasBiomeBossAlive = G.bosses.some(b => b.isBiomeBoss && b.homeBiome === G.currentBiome);
    if(!hasBiomeBossAlive){
      G.biomeBossSpawned[G.currentBiome] = true;
      const bbType = BIOME_BOSSES[G.currentBiome];
      const bb = createBoss(bbType);
      G.bosses.push(bb);
      showToast(`👑 CHEFE DO BIOMA: ${bb.name}!`,'#fbbf24');
      spawnParticle(G.player.x, G.player.y, '#fbbf24', 25, 60, 2, 1.2);
    }
  }
  // Timers
  if(p.invulnerable>0)p.invulnerable-=dt;
  if(p.camoTimer>0)p.camoTimer-=dt;
  if(p.speedBoost>0)p.speedBoost-=dt;
  if(p.regenTimer&&p.regenTimer>0){p.regenTimer-=dt;p.hp=Math.min(p.maxHp,p.hp+8*dt);}
  // v8 — Sombra damage buff timer
  if(p.dmgBuffTimer&&p.dmgBuffTimer>0){
    p.dmgBuffTimer-=dt;
    if(p.dmgBuffTimer<=0){p.dmgBuffMult=1;}
  }
  // v9 — Shop buff timers
  if(G.visionBoost&&G.visionBoost>0){G.visionBoost-=dt;if(G.visionBoost<=0){G.visionBoost=0;showToast('🔍 Visão voltou ao normal','#888');}}
  if(G.xpBoost&&G.xpBoost>0){G.xpBoost-=dt;if(G.xpBoost<=0){G.xpBoost=0;showToast('⭐ XP boost acabou','#888');}}
  if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}
  G.abilityCooldowns[0]=Math.max(0,G.abilityCooldowns[0]-dt);
  G.abilityCooldowns[1]=Math.max(0,G.abilityCooldowns[1]-dt);
  // Spiderlings AI
  p.spiderlings.forEach(s=>{
    s.life-=dt;
    const sdx=p.x-s.x;const sdy=p.y-s.y;const sd=Math.sqrt(sdx*sdx+sdy*sdy);
    if(sd>100){s.x+=sdx/sd*3*60*dt;s.y+=sdy/sd*3*60*dt;}
    // Attack nearby predators
    G.predators.forEach(pred=>{
      const pd=Math.sqrt((pred.x-s.x)**2+(pred.y-s.y)**2);
      if(pd<60){pred.hp-=5*dt;s.x=pred.x;s.y=pred.y-30;}
    });
  });
  p.spiderlings=p.spiderlings.filter(s=>s.life>0);
  // Spiders AI
  G.spiders.forEach(s=>{
    if(!s.alive)return;
    s.animPhase+=dt*4;
    s.moveTimer-=dt;
    if(s.moveTimer<=0){s.dir=Math.random()*Math.PI*2;s.moveTimer=2+Math.random()*4;}
    const sdx=s.x-p.x;const sdy=s.y-p.y;const sd=Math.sqrt(sdx*sdx+sdy*sdy);
    if(sd<180){s.dir=Math.atan2(sdy,sdx);s.moveTimer=1;}
    // Smooth facing direction (like player)
    let sDiff=s.dir-s.facingDir;
    if(sDiff>Math.PI)sDiff-=Math.PI*2;else if(sDiff<-Math.PI)sDiff+=Math.PI*2;
    s.facingDir+=sDiff*Math.min(1,5*dt);
    s.x+=Math.cos(s.dir)*s.speed*30*dt;
    s.y+=Math.sin(s.dir)*s.speed*30*dt;
    s.x=Math.max(30,Math.min(WORLD_SIZE-30,s.x));
    s.y=Math.max(30,Math.min(WORLD_SIZE-30,s.y));
    // Fusion check (1 trait match)
    const fusionDist=20+p.size*8;
    if(sd<fusionDist&&canFusion(p.mutations,s.mutations)){
      const result=performFusion(p,s);
      if(result){
        s.alive=false;
        const val=getSpiderValue(p.mutations);
        const rarity=getRarity(val);
        spawnFusionParticles(s.x,s.y,rarity.name);
        spawnFusionPopup(s.x,s.y,result);
        if(result.isNew)showToast(`NOVA MUTAÇÃO! ${result.layerName}: ${result.newVal}`,'#34d399');
        if(result.combo>=3)showToast(`COMBO x${result.combo}!`,'#fbbf24');
      }
    }
  });
  G.spiders=G.spiders.filter(s=>s.alive);
  // Predators AI
  // Improvement 1 — "aranhas maiores devem correr atrás até mudar de mapa,
  // mudou de mapa ela para e volta para seu mapa". Each predator remembers its
  // homeBiome (set when spawned). While the player is inside that biome AND
  // within detection range, the predator chases. As soon as the player leaves
  // the biome, the predator stops chasing and walks back toward its home
  // biome's center. Once back home, it resumes wandering.
  G.predators.forEach(pred=>{
    if(!pred.alive)return;
    pred.animPhase+=dt*3;
    // PATCH 3/6 — burn & frozen timers
    if(pred.burnTimer&&pred.burnTimer>0){
      pred.burnTimer-=dt;
      if(!pred.hasNoHp){pred.hp-=8*dt;}
      if(Math.random()<0.3)spawnParticle(pred.x,pred.y,'#f87171',2,15,1,0.4);
    }
    if(pred.frozenTimer&&pred.frozenTimer>0){pred.frozenTimer-=dt;}
    // v8 — Vento push timer: continuously push enemy away from push origin
    if(pred.pushTimer&&pred.pushTimer>0){
      pred.pushTimer-=dt;
      if(pred.pushFrom){
        const dx=pred.x-pred.pushFrom.x,dy=pred.y-pred.pushFrom.y;
        const dl=Math.sqrt(dx*dx+dy*dy)||1;
        // Push outward at 2 px/frame
        pred.x+=dx/dl*2*60*dt;
        pred.y+=dy/dl*2*60*dt;
      }
    }
    const pdx=p.x-pred.x;const pdy=p.y-pred.y;const pd=Math.sqrt(pdx*pdx+pdy*pdy);
    let speed=pred.speed;
    if(pred.frozenTimer&&pred.frozenTimer>0){speed*=0.1;}
    if(pred.snared>0){pred.snared-=dt;speed*=0.2;}
    // v8 — Hunter lunge speed boost
    if(pred.lungeBoost&&pred.lungeBoost>0){speed*=pred.lungeBoost;}
    const playerInHomeBiome=(typeof pred.homeBiome==='number')&&(biomeAt(p.y)===pred.homeBiome);
    let detectionRange=pred.chaseRange;
    if(p.camoTimer>0)detectionRange*=0.3;
    // Phantom teleport mechanic
    if(pred.type==='phantom'&&pred.teleportTimer!==undefined){
      pred.teleportTimer-=dt;
      if(pred.teleportTimer<=0&&pred.state==='chase'){
        const tAngle=Math.random()*Math.PI*2;
        const tDist=150+Math.random()*200;
        pred.x=Math.max(50,Math.min(WORLD_SIZE-50,p.x+Math.cos(tAngle)*tDist));
        pred.y=Math.max(50,Math.min(WORLD_SIZE-50,p.y+Math.sin(tAngle)*tDist));
        pred.teleportTimer=3+Math.random()*5;
        spawnParticle(pred.x,pred.y,'#a855f7',15,40,2,0.8);
      }
    }
    // v9 — Spitter ranged attack: 3-spread + trail
    if(pred.type==='spitter'&&pred.spitTimer!==undefined&&pred.state==='chase'){
      pred.spitTimer-=dt;
      if(pred.spitTimer<=0&&pd<550){
        pred.spitTimer=2+Math.random()*3;
        G.projectiles=G.projectiles||[];
        const sAngle=Math.atan2(pdy,pdx);
        // v11 — 3-spread laser spit (replaces plain circles)
        for(let k=-1;k<=1;k++){
          const ang=sAngle+k*0.15;
          G.projectiles.push({
            x:pred.x,y:pred.y,
            vx:Math.cos(ang)*8,vy:Math.sin(ang)*8,
            angle:ang, type:'laser', color:'#34d399',
            damage:12+Math.floor(pred.size*3),life:2.5,
            size:4,length:55,trail:true,
            fromEnemy:true
          });
        }
        // Spit charge particles
        for(let i=0;i<8;i++){
          const a=sAngle+(Math.random()-0.5)*0.6;
          G.particles.push({
            x:pred.x,y:pred.y,
            vx:Math.cos(a)*2,vy:Math.sin(a)*2,
            life:0.3,maxLife:0.3,
            color:'#34d399',size:2,gravity:0,rotation:0,rotSpeed:0,star:false
          });
        }
      }
    }
    // v8 — Hunter lunge attack (medium enemy): periodically lunges at the player
    if(pred.type==='hunter'&&pred.hunterLungeTimer!==undefined&&pred.state==='chase'){
      pred.hunterLungeTimer-=dt;
      if(pred.hunterLungeTimer<=0&&pd<400&&pd>80){
        pred.hunterLungeTimer=4+Math.random()*3;
        // Lunge: quick burst toward player + bonus damage on next hit
        pred.lungeBoost=1.5; // speed multiplier for 0.5s
        pred.lungeTimer=0.5;
        pred.damageBuff=true;
        spawnParticle(pred.x,pred.y,'#fb923c',10,30,1,0.5);
      }
      if(pred.lungeTimer&&pred.lungeTimer>0){
        pred.lungeTimer-=dt;
        if(pred.lungeTimer<=0){pred.lungeBoost=0;pred.damageBuff=false;}
      }
    }
    // v8 — Swarm frenzy: periodically speeds up
    if(pred.type==='swarm'&&pred.swarmFrenzyTimer!==undefined&&pred.state==='chase'){
      pred.swarmFrenzyTimer-=dt;
      if(pred.swarmFrenzyTimer<=0){
        pred.swarmFrenzyTimer=5+Math.random()*3;
        pred.frenzyTimer=2; // 2s of +50% speed
        spawnParticle(pred.x,pred.y,'#fbbf24',8,25,1,0.5);
      }
      if(pred.frenzyTimer&&pred.frenzyTimer>0){
        pred.frenzyTimer-=dt;
        speed*=1.5;
      }
    }
    // State machine: chase only if player is in our home biome AND in range.
    if(playerInHomeBiome&&pd<detectionRange){
      pred.state='chase';
    } else if(!playerInHomeBiome){
      pred.state='returning';
    } else {
      pred.state='wander';
    }
    if(pred.state==='chase'){
      pred.dir=Math.atan2(pdy,pdx);
      pred.x+=Math.cos(pred.dir)*speed*60*dt;
      pred.y+=Math.sin(pred.dir)*speed*60*dt;
      // Smooth facing direction
      let pDiff=pred.dir-pred.facingDir;
      if(pDiff>Math.PI)pDiff-=Math.PI*2;else if(pDiff<-Math.PI)pDiff+=Math.PI*2;
      pred.facingDir+=pDiff*Math.min(1,5*dt);
    } else if(pred.state==='returning'){
      // Walk toward home biome's center y. Once we're back inside, drop into wander.
      const homeY=biomeCenterY(pred.homeBiome);
      const homeDy=homeY-pred.y;
      const homeDist=Math.abs(homeDy);
      if(biomeAt(pred.y)===pred.homeBiome&&homeDist<WORLD_SIZE/BIOMES.length*0.3){
        // Arrived home — slow down and resume wandering.
        pred.moveTimer-=dt;
        if(pred.moveTimer<=0){pred.dir=Math.random()*Math.PI*2;pred.moveTimer=2+Math.random()*3;}
        pred.x+=Math.cos(pred.dir)*speed*0.3*60*dt;
        pred.y+=Math.sin(pred.dir)*speed*0.3*60*dt;
      } else {
        // Head home: bias movement toward homeY while still wandering sideways a bit.
        pred.dir=Math.atan2(homeDy,Math.cos(G.gameTime*0.5+pred.x*0.01)*100);
        pred.x+=Math.cos(pred.dir)*speed*0.6*60*dt;
        pred.y+=Math.sin(pred.dir)*speed*0.6*60*dt;
      }
    } else {
      // Wander inside home biome.
      pred.moveTimer-=dt;
      if(pred.moveTimer<=0){pred.dir=Math.random()*Math.PI*2;pred.moveTimer=2+Math.random()*3;}
      pred.x+=Math.cos(pred.dir)*speed*0.3*60*dt;
      pred.y+=Math.sin(pred.dir)*speed*0.3*60*dt;
    }
    pred.x=Math.max(30,Math.min(WORLD_SIZE-30,pred.x));
    pred.y=Math.max(30,Math.min(WORLD_SIZE-30,pred.y));
    // All predators deal damage on contact — no freezing, keep it frenetic!
    const hitDist=20+pred.size*10;
    if(pred.state==='chase'&&pd<hitDist&&p.invulnerable<=0){
      let dmg=pred.damage;
      // v8 — Hunter damage buff during lunge
      if(pred.damageBuff)dmg*=1.8;
      if(p.shield>0){const absorbed=Math.min(p.shield,dmg);p.shield-=absorbed;dmg-=absorbed;}
      // v8 — 'escudo' passive damage reduction (max 30% at lvl 5)
      if(p.abilities.includes('escudo')){
        const elvl=p.abilityLevels['escudo']||1;
        dmg*=(1-0.06*elvl); // up to 30% at lvl 5
      }
      // v8 — Sombra dmg buff increases player damage, not mitigation — skip here
      if(p.damageReduction){dmg*=(1-p.damageReduction);}
      p.hp-=dmg*dt*3;
      p.invulnerable=0.3;
      spawnParticle(p.x,p.y,'#f87171',4,25,1,0.5);
    }
    // Killable predators (with HP) can be defeated
    if(!pred.hasNoHp&&pred.hp<=0&&pred.maxHp>0){
      pred.alive=false;
      const reward=Math.floor(pred.size*25);
      G.coins+=reward;
      spawnParticle(pred.x,pred.y,'#fbbf24',20,50,2,1);
      showToast(`Predador derrotado! +${reward} moedas`,'#fbbf24');
    }
    // No-HP predators — survive near them for rewards
    if(pred.hasNoHp&&pred.state==='chase'){
      pred.surviveTimer=(pred.surviveTimer||0)+dt;
      if(pred.surviveTimer>=8){
        pred.surviveTimer=0;
        G.coins+=Math.floor(pred.size*10);
        showToast(`Sobreviveu! +${Math.floor(pred.size*10)} moedas`,'#34d399');
      }
    }
  });
  G.predators=G.predators.filter(p=>p.alive);
  // Bosses AI — deal DAMAGE on contact, no freezing. Keep it frenetic!
  G.bosses.forEach(b=>{
    if(!b.alive)return;
    b.animPhase+=dt*2;
    // burn timer on bosses
    if(b.burnTimer&&b.burnTimer>0){
      b.burnTimer-=dt;
      if(Math.random()<0.3)spawnParticle(b.x,b.y,'#f87171',3,20,1,0.5);
    }
    // v8 — Vento push timer on bosses
    if(b.pushTimer&&b.pushTimer>0){
      b.pushTimer-=dt;
      if(b.pushFrom){
        const dx=b.x-b.pushFrom.x,dy=b.y-b.pushFrom.y;
        const dl=Math.sqrt(dx*dx+dy*dy)||1;
        b.x+=dx/dl*1.5*60*dt; // bosses pushed slower
        b.y+=dy/dl*1.5*60*dt;
      }
    }
    const bdx=p.x-b.x;const bdy=p.y-b.y;const bd=Math.sqrt(bdx*bdx+bdy*bdy);
    const playerInHomeBiome=(typeof b.homeBiome==='number')&&(biomeAt(p.y)===b.homeBiome);
    if(playerInHomeBiome&&bd<b.chaseRange){
      b.state='chase';
      b.dir=Math.atan2(bdy,bdx);
    } else if(!playerInHomeBiome){
      b.state='returning';
      const homeY=biomeCenterY(b.homeBiome);
      b.dir=Math.atan2(homeY-b.y,0);
    } else {
      b.state='wander';
    }
    let bSpeed=b.speed;
    if(b.snared>0){b.snared-=dt;bSpeed*=0.3;}
    if(b.state==='returning')bSpeed*=0.7;
    else if(b.state==='wander')bSpeed*=0.4;
    b.x+=Math.cos(b.dir)*bSpeed*60*dt;
    b.y+=Math.sin(b.dir)*bSpeed*60*dt;
    // Smooth facing direction
    let bDiff=b.dir-b.facingDir;
    if(bDiff>Math.PI)bDiff-=Math.PI*2;else if(bDiff<-Math.PI)bDiff+=Math.PI*2;
    b.facingDir+=bDiff*Math.min(1,4*dt);
    b.x=Math.max(30,Math.min(WORLD_SIZE-30,b.x));
    b.y=Math.max(30,Math.min(WORLD_SIZE-30,b.y));
    // Boss deals damage on contact — just like predators but stronger
    const hitDist=30+b.size*10;
    if(b.state==='chase'&&bd<hitDist&&p.invulnerable<=0){
      let dmg=b.damage;
      if(p.shield>0){const absorbed=Math.min(p.shield,dmg);p.shield-=absorbed;dmg-=absorbed;}
      p.hp-=dmg*dt*2;
      p.invulnerable=0.5;
      spawnParticle(p.x,p.y,'#f87171',6,35,1,0.5);
    }
    // Boss survive reward
    if(b.state==='chase'){
      b.surviveTimer=(b.surviveTimer||0)+dt;
      if(b.surviveTimer>=b.surviveReward){
        b.surviveTimer=0;
        const reward=150+Math.floor(b.size*20);
        G.coins+=reward;
        showToast(`Sobreviveu ao ${b.name}! +${reward} moedas`,'#34d399');
      }
    }
    // v9 — Boss ranged attack with rich particle effects.
    // Player OUTSIDE attackRadius takes NO damage.
    if(b.state==='chase'){
      b.attackTimer=(b.attackTimer||0)+dt;
      // v9 — Telegraph: warn player 0.6s before attack lands
      if(b.attackTimer>=b.attackInterval-0.6 && !(b._telegraphed||false)){
        b._telegraphed=true;
        // Charging particles around boss
        for(let i=0;i<12;i++){
          const a=(i/12)*Math.PI*2;
          const r=b.size*8;
          G.particles.push({
            x:b.x+Math.cos(a)*r,y:b.y+Math.sin(a)*r,
            vx:-Math.cos(a)*2,vy:-Math.sin(a)*2,
            life:0.6,maxLife:0.6,

    // This guarantees lightning is always visible (storm/mix bosses) and every

    if(b.state==='chase'){

            size=7;

            type='laser'; sp=8;
            color=arm===0?'#ff66ff':'#66ffff';

          }

            x:b.x, y:b.y,
            vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,

    }

    }
  });
  G.bosses=G.bosses.filter(b=>b.alive);
  // v11 — Projectiles update: per-type trail particles + friendly/enemy collisions
  G.projectiles=G.projectiles||[];
  G.projectiles.forEach(proj=>{
    proj.x+=proj.vx*60*dt;
    proj.y+=proj.vy*60*dt;
    proj.life-=dt;
    // angle for drawing (rotation while flying)
    proj.angle=Math.atan2(proj.vy,proj.vx);

    if(proj.trail){
      const ttype=proj.type||'basic';
      const trailRate=ttype==='lightning'?0.95:ttype==='fire'?0.85:ttype==='plasma'?0.8:ttype==='ice'?0.7:ttype==='laser'?0.5:0.6;
      if(Math.random()<trailRate){
        let pColor=proj.color||'#f87171';
        if(ttype==='fire')pColor=Math.random()<0.5?'#ff8c1a':'#ffc107';
        else if(ttype==='ice')pColor=Math.random()<0.5?'#4da6ff':'#e0ffff';

  G.projectiles=G.projectiles.filter(proj=>proj.life>0 && proj.x>-300 && proj.x<WORLD_SIZE+300 && proj.y>-300 && proj.y<WORLD_SIZE+300);

  const waveAfter20 = Math.max(0, G.wave - 20);

  if(G.predSpawnTimer>2.5&&G.predators.length<maxPreds){

    }

  }
  // v14 — Boss spawn — maintain 3 bosses on map (was 2). Show a 10-second

  G.bossSpawnTimer+=dt;

      G.goblinSpider = {
        x: Math.max(100, Math.min(WORLD_SIZE-100, p.x + (Math.random()-0.5)*1500)),
        y: Math.max(100, Math.min(WORLD_SIZE-100, p.y + (Math.random()-0.5)*1500)),
        mutations: {corpo:'corpo_neon', olho:'olho_roxo_estrela', pata:'pata_roxo_branco', mancha:'mancha_estrela_roxa'},
        size: 3,         // size 4 as requested
        speed: 1.5,
        dir: Math.random()*Math.PI*2,
        facingDir: Math.random()*Math.PI*2,
        moveTimer: 0,
        alive: true,
        animPhase: Math.random()*Math.PI*2,
        isGoblin: true,
        life: 60,        // disappears after 60s if not caught
        bornTime: G.gameTime
      };
      showToast('❓ Aranha GOBLIN avistada! Pegue-a para uma recompensa surpresa!','#39ff14');
    }
  }
  // v14 — Update goblin spider AI
  if(G.goblinSpider){
    const gs = G.goblinSpider;
    gs.life -= dt;
    gs.animPhase += dt*4;
    gs.moveTimer -= dt;
    if(gs.moveTimer <= 0){
      gs.dir = Math.random()*Math.PI*2;
      gs.moveTimer = 1.5 + Math.random()*2;
    }
    // Run away from player if too close (it's elusive)
    const gdx = gs.x - p.x, gdy = gs.y - p.y;
    const gd = Math.hypot(gdx, gdy);
    if(gd < 350){
      gs.dir = Math.atan2(gdy, gdx);  // flee directly away
      gs.moveTimer = 0.5;
    }
    gs.x += Math.cos(gs.dir) * gs.speed * 60 * dt;
    gs.y += Math.sin(gs.dir) * gs.speed * 60 * dt;
    // Smooth facing direction
    let gDiff=gs.dir-gs.facingDir;
    if(gDiff>Math.PI)gDiff-=Math.PI*2;else if(gDiff<-Math.PI)gDiff+=Math.PI*2;
    gs.facingDir+=gDiff*Math.min(1,5*dt);
    gs.x = Math.max(30, Math.min(WORLD_SIZE-30, gs.x));
    gs.y = Math.max(30, Math.min(WORLD_SIZE-30, gs.y));
    // Catch check: player touches goblin
    const catchDist = 20 + p.size * 8;
    if(gd < catchDist){
      // Trigger surprise reward
      triggerGoblinReward(gs);
      G.goblinSpider = null;
    } else if(gs.life <= 0){
      G.goblinSpider = null;
      showToast('A aranha goblin escapou...','#888');
    }
  }
  // v14 — Goblin popup timer
  if(G.goblinPopupTimer > 0){
    G.goblinPopupTimer -= dt;
    if(G.goblinPopupTimer <= 0){
      const gp = document.getElementById('goblinPopup');
      if(gp) gp.classList.add('hidden');
    }
  }
  // Particles
  G.particles.forEach(pt=>{
    pt.x+=pt.vx*60*dt;pt.y+=pt.vy*60*dt;
    pt.vy+=pt.gravity*dt;
    pt.life-=dt;
    pt.rotation+=pt.rotSpeed*dt;
  });
  G.particles=G.particles.filter(pt=>pt.life>0);
  // Ability effects
  G.abilitiesEffect.forEach(ae=>{
    ae.life-=dt;ae.phase+=dt*3;
  });
  G.abilitiesEffect=G.abilitiesEffect.filter(ae=>ae.life>0);
  // Fusion popups
  G.fusionPopups.forEach(fp=>{fp.life-=dt;});
  G.fusionPopups=G.fusionPopups.filter(fp=>fp.life>0);
  // Toasts
  G.toasts.forEach(t=>{t.life-=dt;});
  G.toasts=G.toasts.filter(t=>t.life>0);
  updateHUD();
  updateAbilityButtons();
}

// v14 — Goblin spider reward: random surprise outcome
function triggerGoblinReward(gs){
  const outcomes = [
    {icon:'💰', text:'+500 MOEDAS!', color:'#fbbf24', action:()=>{ G.coins += 500; }},
    {icon:'⭐', text:'+400 XP!', color:'#a78bfa', action:()=>{ const p=G.player; p.xp += 400; checkLevelUp(); }},
    {icon:'❤️', text:'VIDA CHEIA!', color:'#f87171', action:()=>{ const p=G.player; p.hp = p.maxHp; }},
    {icon:'🕸', text:'5 aranhas amigas!', color:'#34d399', action:()=>{
      const p=G.player;
      for(let i=0;i<5;i++){
        const ang = (i/5)*Math.PI*2;
        G.spiders.push({
          x: p.x + Math.cos(ang)*80,
          y: p.y + Math.sin(ang)*80,
          mutations: {corpo:'corpo_neon', olho:'olho_roxo_estrela', pata:'pata_roxo_branco', mancha:'mancha_estrela_roxa'},
          size: 1.5,
          speed: 0.8,
          dir: Math.random()*Math.PI*2,
          moveTimer: 0,
          alive: true,
          animPhase: 0,
          bornTime: G.gameTime
        });
      }
    }},
    {icon:'💀', text:'A goblin virou inimigo!', color:'#a855f7', action:()=>{
      // Turn into an alfa predator that chases the player
      const alfa = createPredator('alfa', false, G.currentBiome);
      alfa.x = gs.x; alfa.y = gs.y;
      alfa.mutations = {...gs.mutations};
      alfa.chaseRange = 1500;
      G.predators.push(alfa);
    }},
    {icon:'🎁', text:'BÔNUS TOTAL: moedas+XP+HP!', color:'#fbbf24', action:()=>{
      G.coins += 300;
      const p=G.player;
      p.xp += 250;
      p.hp = Math.min(p.maxHp, p.hp + 80);
      checkLevelUp();
    }}
  ];
  const outcome = outcomes[Math.floor(Math.random()*outcomes.length)];
  outcome.action();
  // Show popup
  const gp = document.getElementById('goblinPopup');
  if(gp){
    gp.classList.remove('hidden');
    document.getElementById('goblinIcon').textContent = outcome.icon;
    document.getElementById('goblinText').textContent = outcome.text;
    document.getElementById('goblinText').style.color = outcome.color;
    G.goblinPopupTimer = 3;
  }
  showToast(`${outcome.icon} Goblin: ${outcome.text}`, outcome.color);
  spawnParticle(gs.x, gs.y, '#39ff14', 35, 80, 3, 1.5);
  spawnParticle(gs.x, gs.y, '#ffffff', 20, 60, 2, 1.2);
}

function playerDied(){
  G.running=false;
  document.getElementById('joystick').style.display='none';
  const p=G.player;
  // Track records
  if(p.level>G.recordLevel)G.recordLevel=p.level;
  if(G.phase>G.recordPhase)G.recordPhase=G.phase;
  // Death penalty: lose skills & levels, reset to phase 1 small
  // BUT keep: discovered spiders, coins, phase record
  const savedDiscovered=new Set(G.discovered);
  const savedCoins=G.coins;
  const savedTotalFusions=G.totalFusions;
  const savedRecordLevel=G.recordLevel;
  const savedRecordPhase=G.recordPhase;
  const savedPhase=1; // reset to phase 1
  showDeathScreen(p.level, G.phase, savedRecordLevel, savedRecordPhase);
  // After death, reset player
  p.level=1;
  p.xp=0;
  p.xpToNext=100;
  p.size=1;
  p.fusionCount=0;
  p.baseSpeed=3;
  p.maxHp=100;
  p.hp=p.maxHp;
  p.abilities=[];
  p.ownedAbilities=[];
  p.abilityLevels={};
  p.lastSizeThreshold=1;
  p.shield=0;
  p.spiderlings=[];
  p.phase=1;
  G.phase=1;
  G.phaseFusions=0;
  G.paused=false;
  G.choiceModalOpen=false;
  G.coins=savedCoins;
  G.totalFusions=savedTotalFusions;
  G.discovered=savedDiscovered;
  G.recordLevel=savedRecordLevel;
  G.recordPhase=savedRecordPhase;
  saveGame(G.currentSlot);
}

// v11 — Pré-renderização do bioma no bgCache
function updateBiomeCache(){
  const bgCache=document.getElementById('bgCache');
  if(!bgCache)return;
  const bgCtx=bgCache.getContext('2d');
  const biome=BIOMES[G.currentBiome];

  // Verificar se precisa atualizar
  if(bgCache._lastBiome===G.currentBiome&&bgCache._lastWidth===canvas.width&&bgCache._lastHeight===canvas.height)return;

  bgCache.width=canvas.width;
  bgCache.height=canvas.height;
  bgCache._lastBiome=G.currentBiome;
  bgCache._lastWidth=canvas.width;
  bgCache._lastHeight=canvas.height;

  // Desenhar gradiente do bioma
  const grad=bgCtx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,biome.bgGrad[0]);
  grad.addColorStop(0.5,biome.bgGrad[1]);
  grad.addColorStop(1,biome.bgGrad[2]);
  bgCtx.fillStyle=grad;
  bgCtx.fillRect(0,0,canvas.width,canvas.height);
}

// === RENDER ===
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const p=G.player;
  if(!p)return;
  // v11 — Background otimizado: usar bgCache pré-renderizado
  updateBiomeCache(); // Atualizar cache do bioma se necessário
  const biome=BIOMES[G.currentBiome];
  const bgImg=document.getElementById('bgImageSrc');
  if(window.__bgImageLoaded&&bgImg&&bgImg.naturalWidth>0){
    const imgW=bgImg.naturalWidth,imgH=bgImg.naturalHeight;
    const wx=-G.camera.x, wy=-G.camera.y;
    const startX=Math.floor(wx/imgW)*imgW;
    const startY=Math.floor(wy/imgH)*imgH;
    for(let x=startX;x<wx+canvas.width;x+=imgW){
      for(let y=startY;y<wy+canvas.height;y+=imgH){
        ctx.drawImage(bgImg,x,y,imgW,imgH);
      }
    }
    ctx.fillStyle=withAlpha(biome.bgGrad[1],0.35);
    ctx.fillRect(0,0,canvas.width,canvas.height);
  } else {
    // Usar bgCache pré-renderizado (atualizado em updateBiomeCache)
    const bgCache=document.getElementById('bgCache');
    if(bgCache){
      ctx.drawImage(bgCache,0,0);
    }
    // v15 — Subtle background grid for movement reference (depth/speed)
    ctx.save();
    ctx.strokeStyle = withAlpha(biome.accent, 0.08);
    ctx.lineWidth = 1;
    const gridSize = 150;
    const offsetX = (G.camera.x * 0.4) % gridSize; // Parallax grid
    const offsetY = (G.camera.y * 0.4) % gridSize;
    ctx.beginPath();
    for(let x=offsetX; x<canvas.width; x+=gridSize){
      ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for(let y=offsetY; y<canvas.height; y+=gridSize){
      ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(G.camera.x,G.camera.y);
  // v12 — Draw ambient motes (convey motion/speed)
  (G.ambientMotes||[]).forEach(m=>{
    const fade=Math.min(1, m.life/2) * Math.min(1, (m.maxLife-m.life)/0.5);
    const a=Math.max(0, fade)*m.alpha;
    if(a<=0.02)return;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle=m.color;
    if(m.kind==='leaf'){
      // small leaf-like ellipse
      ctx.translate(m.x,m.y);
      ctx.rotate(m.phase);
      ctx.beginPath();
      ctx.ellipse(0,0,m.size*1.5,m.size*0.7,0,0,Math.PI*2);
      ctx.fill();
    } else if(m.kind==='bubble'){
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=a*0.6;
      ctx.strokeStyle=m.color;
      ctx.lineWidth=1;
      ctx.stroke();
    } else if(m.kind==='spark'){
      ctx.shadowBlur=6; ctx.shadowColor=m.color;
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    } else { // mote / dust
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  // v11 — Biome decorations: desenhar apenas elementos decorativos móveis
  // Padrões estáticos do bioma agora são pré-renderizados no bgCache
  // drawBiomePattern(ctx,biome,G.currentBiome,p,G.gameTime); // REMOVIDO: agora pré-renderizado
  // v12 — Outer "out of bounds" hatched void so player clearly sees the edge.
  // Draw a dark hatched pattern in the area OUTSIDE the world rectangle.
  {
    const viewLeft=-G.camera.x, viewTop=-G.camera.y;
    const viewRight=viewLeft+canvas.width, viewBottom=viewTop+canvas.height;
    // Hatched void fill
    ctx.save();
    ctx.beginPath();
    ctx.rect(viewLeft, viewTop, canvas.width, canvas.height);
    ctx.rect(0,0,WORLD_SIZE,WORLD_SIZE);
    ctx.clip('evenodd');
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.fillRect(viewLeft, viewTop, canvas.width, canvas.height);
    // Diagonal red-warning hatch
    ctx.strokeStyle='rgba(255,60,60,0.18)';
    ctx.lineWidth=2;
    const step=24;
    for(let x=viewLeft-Math.abs(viewBottom-viewTop); x<viewRight; x+=step){
      ctx.beginPath();
      ctx.moveTo(x, viewTop);
      ctx.lineTo(x+(viewBottom-viewTop), viewBottom);
      ctx.stroke();
    }
    ctx.restore();
  }
  // v12 — Glowing world boundary — thick + pulsing accent border
  const pulse=0.6+0.4*Math.sin(G.gameTime*3);
  ctx.lineWidth=8;
  ctx.strokeStyle=withAlpha(biome.accent, 0.5+0.3*pulse);
  ctx.shadowBlur=24; ctx.shadowColor=biome.accent;
  ctx.strokeRect(0,0,WORLD_SIZE,WORLD_SIZE);
  ctx.shadowBlur=0;
  // Inner thin accent line for crisp definition
  ctx.lineWidth=2;
  ctx.strokeStyle=withAlpha('#ffffff',0.5);
  ctx.strokeRect(0,0,WORLD_SIZE,WORLD_SIZE);
  // Corner markers — large pulsing diamonds so edges are obvious
  ctx.fillStyle=withAlpha(biome.accent,0.8);
  ctx.shadowBlur=16; ctx.shadowColor=biome.accent;
  const cornerSz=14+4*pulse;
  [[0,0],[WORLD_SIZE,0],[0,WORLD_SIZE],[WORLD_SIZE,WORLD_SIZE]].forEach(([cx,cy])=>{
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(Math.PI/4);
    ctx.fillRect(-cornerSz/2,-cornerSz/2,cornerSz,cornerSz);
    ctx.restore();
  });
  ctx.shadowBlur=0;
  // Edge midpoint markers (so player sees wall even when far from corners)
  ctx.fillStyle=withAlpha('#ffffff',0.6);
  const edgeMark=8;
  for(let i=1;i<8;i++){
    const t=i/8;
    const x=t*WORLD_SIZE;
    ctx.fillRect(x-edgeMark/2,-edgeMark, edgeMark, edgeMark*2);
    ctx.fillRect(x-edgeMark/2,WORLD_SIZE-edgeMark, edgeMark, edgeMark*2);
    const y=t*WORLD_SIZE;
    ctx.fillRect(-edgeMark,y-edgeMark/2, edgeMark*2, edgeMark);
    ctx.fillRect(WORLD_SIZE-edgeMark,y-edgeMark/2, edgeMark*2, edgeMark);
  }
  // Biome dividers — KEEP these for game mechanic
  ctx.strokeStyle=withAlpha('#ffffff',0.15);ctx.lineWidth=2;
  ctx.setLineDash([10,10]);
  for(let i=1;i<BIOMES.length;i++){
    const y=(WORLD_SIZE/BIOMES.length)*i;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD_SIZE,y);ctx.stroke();
  }
  ctx.setLineDash([]);
  // Event effects
  if(G.event){
    if(G.event.effect==='vision_debuff'){
      ctx.fillStyle='rgba(0,0,20,0.4)';
      ctx.fillRect(p.x-canvas.width,p.y-canvas.height,canvas.width*2,canvas.height*2);
    }
    if(G.event.effect==='fog'){
      ctx.fillStyle=`rgba(120,120,140,${0.25})`;
      ctx.fillRect(0,0,WORLD_SIZE,WORLD_SIZE);
    }
    if(G.event.effect==='chuva'){
      ctx.strokeStyle='rgba(120,170,255,0.25)';ctx.lineWidth=1.5;
      for(let i=0;i<60;i++){
        const rx=p.x-500+Math.random()*1000;
        const ry=p.y-500+Math.random()*1000;
        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+15);ctx.stroke();
      }
    }
    // v14 — Teias Gigantes: draw visible web patches on the ground
    if(G.event.effect==='web_patches'){
      G.webPatches.forEach(wp=>{
        const dx=wp.x-p.x, dy=wp.y-p.y;
        if(Math.abs(dx)>canvas.width*0.7||Math.abs(dy)>canvas.height*0.7)return;
        ctx.save();
        ctx.translate(wp.x, wp.y);
        // Patch base — light silk disc
        ctx.fillStyle='rgba(230,230,240,0.12)';
        ctx.beginPath();ctx.arc(0,0,wp.r,0,Math.PI*2);ctx.fill();
        // Web radial lines
        ctx.strokeStyle='rgba(240,240,250,0.6)';ctx.lineWidth=1.5;
        const spokes=10;
        for(let i=0;i<spokes;i++){
          const a=(i/spokes)*Math.PI*2 + wp.phase*0.2;
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a)*wp.r, Math.sin(a)*wp.r);
          ctx.stroke();
        }
        // Web spiral/rings
        ctx.strokeStyle='rgba(220,220,235,0.5)';ctx.lineWidth=1;
        for(let ring=1;ring<=4;ring++){
          const rr=wp.r*(ring/4);
          ctx.beginPath();
          for(let i=0;i<=spokes;i++){
            const a=(i/spokes)*Math.PI*2 + wp.phase*0.2;
            const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.closePath();
          ctx.stroke();
        }
        // Pulsing danger ring
        const dPulse=0.6+0.4*Math.sin(G.gameTime*3+wp.phase);
        ctx.strokeStyle=`rgba(255,80,80,${0.4*dPulse})`;
        ctx.lineWidth=2.5;
        ctx.beginPath();ctx.arc(0,0,wp.r-3,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      });
    }
    // v14 — Tempestade Elétrica: draw lightning strikes (telegraph + explosion)
    if(G.event.effect==='lightning_storm'){
      G.lightningStrikes.forEach(ls=>{
        const dx=ls.x-p.x, dy=ls.y-p.y;
        if(Math.abs(dx)>canvas.width*0.7||Math.abs(dy)>canvas.height*0.7)return;
        ctx.save();
        ctx.translate(ls.x, ls.y);
        if(ls.warn>0){
          // Telegraph: red pulsing circle + crosshair
          const t=1-ls.warn/0.8;
          const rPulse=0.5+0.5*Math.sin(G.gameTime*30);
          ctx.strokeStyle=`rgba(255,80,80,${0.6+0.4*rPulse})`;
          ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(0,0,80*(0.5+t*0.5),0,Math.PI*2);ctx.stroke();
          // Inner red fill growing
          ctx.fillStyle=`rgba(255,80,80,${0.15*t})`;
          ctx.beginPath();ctx.arc(0,0,80*(0.5+t*0.5),0,Math.PI*2);ctx.fill();
          // Crosshair
          ctx.strokeStyle=`rgba(255,200,0,${0.7})`;
          ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(-90,0);ctx.lineTo(90,0);
          ctx.moveTo(0,-90);ctx.lineTo(0,90);
          ctx.stroke();
        } else if(ls.explode>0){
          // Explosion: yellow/white burst
          const t=ls.explode/ls.maxExplode;
          const r=(1-t)*120;
          ctx.fillStyle=`rgba(255,220,80,${t*0.5})`;
          ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=`rgba(255,255,255,${t})`;
          ctx.lineWidth=4;
          ctx.beginPath();ctx.arc(0,0,r*0.8,0,Math.PI*2);ctx.stroke();
          // Electric bolts radiating out
          ctx.strokeStyle=`rgba(255,255,200,${t*0.9})`;
          ctx.lineWidth=2;
          for(let i=0;i<8;i++){
            const a=(i/8)*Math.PI*2;
            ctx.beginPath();
            ctx.moveTo(0,0);
            let bx=0, by=0;
            for(let j=1;j<=4;j++){
              const rr=(j/4)*r;
              const jit=(Math.random()-0.5)*20;
              bx=Math.cos(a)*rr+jit;
              by=Math.sin(a)*rr+jit;
              ctx.lineTo(bx,by);
            }
            ctx.stroke();
          }
        }
        ctx.restore();
      });
    }
    // v14 — Eclipse: red-tinted world + dark vignette
    if(G.event.effect==='eclipse'){
      ctx.fillStyle='rgba(80,0,0,0.25)';
      ctx.fillRect(p.x-canvas.width, p.y-canvas.height, canvas.width*2, canvas.height*2);
    }
    // v14 — Chuva Tóxica: green-tinted falling drops
    if(G.event.effect==='toxic_rain'){
      ctx.strokeStyle='rgba(80,220,80,0.4)';ctx.lineWidth=2;
      for(let i=0;i<70;i++){
        const rx=p.x-600+Math.random()*1200;
        const ry=p.y-600+Math.random()*1200;
        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+18);ctx.stroke();
      }
      // Green ground haze
      ctx.fillStyle='rgba(80,220,80,0.08)';
      ctx.fillRect(p.x-canvas.width, p.y-canvas.height, canvas.width*2, canvas.height*2);
    }
    // v14 — Invasão Mutante: subtle purple haze
    if(G.event.effect==='mutant_invasion'){
      ctx.fillStyle='rgba(120,40,200,0.08)';
      ctx.fillRect(p.x-canvas.width, p.y-canvas.height, canvas.width*2, canvas.height*2);
    }
  }
  // v14 — Draw goblin spider (special NPC with "?" mark on its back)
  if(G.goblinSpider){
    const gs=G.goblinSpider;
    const dx=gs.x-p.x, dy=gs.y-p.y;
    if(Math.abs(dx)<=canvas.width*0.7&&Math.abs(dy)<=canvas.height*0.7){
      const gsPx=Math.max(80, 40*gs.size);
      // Strong neon green aura (pulsing) so player sees it from afar
      const gPulse=0.5+0.5*Math.sin(G.gameTime*6);
      ctx.save();
      ctx.shadowColor='#39ff14';ctx.shadowBlur=30+15*gPulse;
      ctx.fillStyle=`rgba(57,255,20,${0.15+0.1*gPulse})`;
      ctx.beginPath();ctx.arc(gs.x, gs.y, gsPx*0.6+gPulse*10, 0, Math.PI*2);ctx.fill();
      ctx.restore();
      // Render the neon spider body
      renderSpiderToCanvas(ctx, gs.mutations, gs.x, gs.y, gsPx, gs.facingDir-Math.PI/2, 1);
      // Bold white "?" on its back (above the spider body)
ctx.save();
ctx.translate(gs.x, gs.y - gsPx*0.1);

// Bold white "?"
ctx.fillStyle='#e8e53f';
ctx.font=`bold ${Math.round(gsPx*0.45)}px Fredoka,sans-serif`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.shadowColor='#39ff14';
ctx.shadowBlur=12;
ctx.fillText('?', 0, 2);

ctx.restore();

    ctx.fillText(`+${Math.floor(fp.data.xp)} XP  ${fp.data.combo>1?'x'+fp.data.combo+' COMBO':''}`,fp.x,fp.y+8-offsetY);
    ctx.restore();
  });
  ctx.restore();
  // Vision debuff overlay
  if(G.event&&G.event.effect==='vision_debuff'){
    const vGrad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,100,canvas.width/2,canvas.height/2,canvas.width*0.5);
    vGrad.addColorStop(0,'rgba(0,0,0,0)');
    vGrad.addColorStop(1,'rgba(0,0,10,0.85)');
    ctx.fillStyle=vGrad;ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // Fog overlay
  if(G.event&&G.event.effect==='fog'){
    ctx.fillStyle='rgba(100,100,120,0.25)';ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // v14 — Eclipse overlay: heavy red vignette so vision is severely reduced
  if(G.event&&G.event.effect==='eclipse'){
    const eGrad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,80,canvas.width/2,canvas.height/2,canvas.width*0.55);
    eGrad.addColorStop(0,'rgba(60,0,0,0)');
    eGrad.addColorStop(0.6,'rgba(80,0,10,0.5)');
    eGrad.addColorStop(1,'rgba(20,0,0,0.9)');
    ctx.fillStyle=eGrad;ctx.fillRect(0,0,canvas.width,canvas.height);
    // Blood-moon tint
    ctx.fillStyle='rgba(180,30,30,0.08)';ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // v14 — Toxic rain green ground tint (HUD layer)
  if(G.event&&G.event.effect==='toxic_rain'){
    ctx.fillStyle='rgba(60,180,60,0.1)';ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // Combo display
  if(G.combo>=2){
    ctx.save();
    ctx.globalAlpha=Math.min(1,G.comboTimer);
    ctx.fillStyle='#fbbf24';
    ctx.font='bold 32px Fredoka,sans-serif';ctx.textAlign='center';
    ctx.shadowColor='#000';ctx.shadowBlur=10;
    ctx.fillText(`COMBO x${G.combo}`,canvas.width/2,canvas.height*0.35);
    ctx.restore();
  }
  // Render minimap
  renderMinimap();
  // Render toasts
  renderToasts();
}

function renderMinimap(){
  const mc=minimapCtx;const mw=110,mh=110;const scale=mw/WORLD_SIZE;
  mc.fillStyle='rgba(0,0,0,0.7)';mc.fillRect(0,0,mw,mh);
  // Biome bands
  BIOMES.forEach((b,i)=>{
    mc.fillStyle=withAlpha(b.color,0.35);
    mc.fillRect(0,i*(mh/BIOMES.length),mw,mh/BIOMES.length);
  });
  // Border lines
  mc.strokeStyle='rgba(255,255,255,0.15)';mc.lineWidth=0.5;
  for(let i=1;i<BIOMES.length;i++){
    const y=i*(mh/BIOMES.length);
    mc.beginPath();mc.moveTo(0,y);mc.lineTo(mw,y);mc.stroke();
  }
  // Spiders
  G.spiders.forEach(s=>{mc.fillStyle='rgba(52,211,153,0.6)';mc.fillRect(s.x*scale-1,s.y*scale-1,2,2);});
  // Predators
  G.predators.forEach(pred=>{mc.fillStyle='rgba(248,113,113,0.85)';mc.fillRect(pred.x*scale-1.5,pred.y*scale-1.5,3,3);});
  // Bosses — v14: biome/mini bosses in different colors
  G.bosses.forEach(b=>{
    if(b.isBiomeBoss)mc.fillStyle='#fbbf24';
    else if(b.isMiniBoss)mc.fillStyle='#fb923c';
    else mc.fillStyle='#a855f7';
    mc.fillRect(b.x*scale-2,b.y*scale-2,5,5);
  });
  // v14 — Goblin spider: bright green pulsing dot on minimap
  if(G.goblinSpider){
    const gs=G.goblinSpider;
    const gpulse=0.6+0.4*Math.sin(G.gameTime*8);
    mc.fillStyle=`rgba(57,255,20,${gpulse})`;
    mc.beginPath();mc.arc(gs.x*scale, gs.y*scale, 4, 0, Math.PI*2);mc.fill();
    mc.strokeStyle='#fff';mc.lineWidth=1;
    mc.stroke();
  }
  // Player
  const p=G.player;
  mc.fillStyle='#fff';mc.beginPath();mc.arc(p.x*scale,p.y*scale,3.5,0,Math.PI*2);mc.fill();
  mc.strokeStyle='rgba(255,255,255,0.4)';mc.lineWidth=1;
  mc.strokeRect((p.x-canvas.width/2)*scale,(p.y-canvas.height/2)*scale,canvas.width*scale,canvas.height*scale);
  // Biome name
  mc.fillStyle='rgba(255,255,255,0.9)';mc.font='bold 9px Fredoka,sans-serif';mc.textAlign='center';
  mc.fillText(BIOMES[G.currentBiome].name,mw/2,mh-4);
}

function renderToasts(){
  G.toasts.forEach((t,i)=>{
    const alpha=Math.min(1,t.life);
    ctx.save();ctx.globalAlpha=alpha;
    ctx.font='bold 11px Fredoka,sans-serif';ctx.textAlign='center';
    const tw=ctx.measureText(t.msg).width+24;
    const tx=canvas.width/2;const ty=100+i*28;
    // Bubble
    ctx.fillStyle='rgba(15,10,30,0.9)';
    ctx.strokeStyle=withAlpha(t.color||'#a78bfa',0.6);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(tx-tw/2,ty-10,tw,22,11);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=t.color||'#e0e0e0';ctx.fillText(t.msg,tx,ty+4);
    ctx.restore();
  });
}

  if(waveNumEl)waveNumEl.textContent=G.wave;
  if(waveProgEl)waveProgEl.style.width=(G.waveTimer/G.waveDuration*100)+'%';
  if(waveInfoEl){
    const remaining=Math.max(0,Math.ceil(G.waveDuration-G.waveTimer));
    let info='';
    if(G.specialWave)info=`⚠ ONDA ESPECIAL! (${remaining}s)`;

function respawn(){
  const ds=document.getElementById('deathScreen');
  if(ds)ds.remove();
  G.running=true;
  G.paused=false;
  G.player.hp=G.player.maxHp;
  G.lastTime=performance.now();
  // PATCH 6 — clear & respawn NPCs across all biomes (sizes reset)
  G.spiders=[];G.predators=[];G.bosses=[];G.projectiles=[];
  const rsw=[3,2,2,2,2,3];
  const rswT=rsw.reduce((a,b)=>a+b,0);
  for(let i=0;i<50;i++){
    let r=Math.random()*rswT,biomeIdx=0;
    for(let j=0;j<rsw.length;j++){r-=rsw[j];if(r<=0){biomeIdx=j;break;}}
    G.spiders.push(randomSpider(false,BIOMES[biomeIdx].mutBias,biomeIdx));
  }
  const rpw=[2,2,2,2,2,3];
  const rpwT=rpw.reduce((a,b)=>a+b,0);
  for(let i=0;i<10;i++){
    let r=Math.random()*rpwT,biomeIdx=0;
    for(let j=0;j<rpw.length;j++){r-=rpw[j];if(r<=0){biomeIdx=j;break;}}
    G.predators.push(createPredator(pickPredatorTypeForWave(G.wave),false,biomeIdx));
  }
  document.getElementById('joystick').style.display='block';
  requestAnimationFrame(gameLoop);
}

function buyShopItem(itemId){
  const p=G.player;if(!p)return;
  const item=SHOP_ITEMS.find(i=>i.id===itemId);if(!item)return;
  if(G.coins<item.cost){showToast('Moedas insuficientes!','#f87171');return;}
  G.coins-=item.cost;
  if(item.effect==='heal'){
    p.hp=p.maxHp;
    showToast(`❤ HP restaurado! (${p.maxHp})`,'#34d399');
    spawnParticle(p.x,p.y,'#34d399',25,50,2,1);
  } else if(item.effect==='shield'){
    p.shield=Math.max(p.shield,60);
    showToast('🛡 Escudo +60!','#f87171');
    spawnParticle(p.x,p.y,'#f87171',20,40,2,1);
  } else if(item.effect==='cooldown'){
    G.abilityCooldowns[0]=0;G.abilityCooldowns[1]=0;
    showToast('⏱ Cooldowns zerados!','#60a5fa');
  } else if(item.effect==='speed'){
    p.speedBoost=Math.max(p.speedBoost||0,20);
    showToast('💨 +50% velocidade por 20s!','#fbbf24');
    spawnParticle(p.x,p.y,'#fbbf24',15,40,2,1);
  } else if(item.effect==='vision'){
    G.visionBoost=30; // picked up in render() to widen visible area
    showToast('🔍 Visão ampliada por 30s!','#60a5fa');
  } else if(item.effect==='xpboost'){
    G.xpBoost=60;
    showToast('⭐ +50% XP por 60s!','#fbbf24');
  } else if(item.effect==='fusion'){
    // Pull 10 nearest alive spiders toward the player
    const sorted=G.spiders.filter(s=>s.alive).map(s=>({s,d:Math.hypot(s.x-p.x,s.y-p.y)})).sort((a,b)=>a.d-b.d).slice(0,10);
    sorted.forEach(({s})=>{s.x=p.x+(Math.random()-0.5)*120;s.y=p.y+(Math.random()-0.5)*120;});
    showToast(`🎯 ${sorted.length} aranhas atraídas!`,'#34d399');
    spawnParticle(p.x,p.y,'#34d399',25,60,2,1);
  } else if(item.effect==='scatter'){
    // Push all predators away from player
    G.predators.forEach(pred=>{
      const dx=pred.x-p.x,dy=pred.y-p.y;const d=Math.hypot(dx,dy)||1;
      pred.x+=dx/d*400;pred.y+=dy/d*400;
    });
    G.bosses.forEach(b=>{
      const dx=b.x-p.x,dy=b.y-p.y;const d=Math.hypot(dx,dy)||1;
      b.x+=dx/d*400;b.y+=dy/d*400;
    });
    showToast('🔄 Inimigos afastados!','#a855f7');
    spawnParticle(p.x,p.y,'#a855f7',30,80,2,1.5);
  }
  updateHUD();
  // Refresh shop modal if open
  if(document.getElementById('shopModal')){
    closeModal('shopModal');
    openShop();
  }
  saveGame(G.currentSlot);
}

// v17 — stopGame(): properly terminates the current game session.
// Called whenever the player exits to the main menu (from the in-game Menu or the death screen).
// Guarantees:
//   1. The game loop stops (G.running = false → gameLoop returns immediately on next frame).
//   2. Auto-save fires once more so progress is persisted.
//   3. Active event banners, boss warnings, goblin popups, toasts and HUD popups are hidden.
//   4. The joystick is hidden (no movement input on the menu).
//   5. G.paused is reset so a future startGame() begins unpaused.
//   6. BGM switches back to the menu theme.
//   7. The start screen is shown with the MAIN menu visible (not the save-slots screen).
function stopGame(){
  // 1. Stop the loop
  G.running = false;
  G.paused = false;
  // 2. Persist progress
  try { if(G.player) saveGame(G.currentSlot); } catch(e) { console.warn('stopGame save failed:', e); }
  // 3. Hide in-game UI overlays
  const hideIds = ['bossWarning','goblinPopup','eventBanner','biomeBanner'];
  hideIds.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('hidden'); });
  // Clear toasts
  G.toasts = [];
  const toastEls = document.querySelectorAll('.toast');
  toastEls.forEach(el => el.remove());
  // Clear fusion popups
  G.fusionPopups = [];
  // 4. Hide joystick
  const joy = document.getElementById('joystick');
  if(joy) joy.style.display = 'none';
  // 5. Close any open pause-modals (defensive — should already be closed by closeModal)
  ['dexModal','abilitiesModal','menuModal','helpModal','saveSlotsModal','shopModal','abilityChoiceModal'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.remove();
  });
  // 6. Switch music
  BGM.switchToMenu();
  // 7. Show start screen with MAIN menu (not save slots)
  resetStartScreen();
  document.getElementById('startScreen').classList.remove('hidden');
}

// === SAVE/LOAD - Multiple slots ===
function saveGame(slot=1){
  try{
    const p=G.player;
    if(!p)return;
    const data={
      slot,
      name:`Save ${slot}`,
      timestamp:Date.now(),
      mutations:p.mutations,
      level:p.level,
      size:p.size,
      fusionCount:p.fusionCount,
      abilities:p.abilities,
      ownedAbilities:p.ownedAbilities,
      abilityLevels:p.abilityLevels,
      lastSizeThreshold:p.lastSizeThreshold,
      hp:p.hp,
      maxHp:p.maxHp,
      coins:G.coins,
      totalFusions:G.totalFusions,
      discovered:Array.from(G.discovered),
      biome:G.currentBiome,
      gameTime:G.gameTime,
      phase:G.phase,
      recordLevel:G.recordLevel,
      recordPhase:G.recordPhase,
      playerPhase:p.phase
    };
    localStorage.setItem('spiderMerge_slot'+slot,JSON.stringify(data));
  }catch(e){console.error('Save error:',e);}
}

function loadGame(slot=1){
  try{
    const raw=localStorage.getItem('spiderMerge_slot'+slot);
    if(!raw)return false;
    const data=JSON.parse(raw);
    const p=G.player;
    p.mutations=data.mutations||p.mutations;
    p.level=data.level||1;
    p.size=data.size||1;
    p.fusionCount=data.fusionCount||0;
    p.abilities=data.abilities||[];
    p.ownedAbilities=data.ownedAbilities||[];
    p.abilityLevels=data.abilityLevels||{};
    p.lastSizeThreshold=data.lastSizeThreshold||1;
    p.hp=data.hp||100;
    p.maxHp=data.maxHp||(100+Math.floor(p.size*22));
    p.baseSpeed=Math.max(1.5,3-p.size*0.12);
    p.xpToNext=Math.pow(1.5,(data.level||1)-1)*100;
    p.phase=data.playerPhase||1;
    G.coins=data.coins||0;
    G.totalFusions=data.totalFusions||0;
    G.discovered=new Set(data.discovered||[]);
    G.phase=data.phase||1;
    G.recordLevel=data.recordLevel||1;
    G.recordPhase=data.recordPhase||1;
    return true;
  }catch(e){console.error('Load error:',e);return false;}
}

function getSaveData(slot){

    if(!raw)return null;

}

// Polyfill for roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
    return this;
  };
}
